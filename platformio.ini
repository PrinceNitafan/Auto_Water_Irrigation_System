; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = multi

[env]
platform = atmelavr
board = uno
framework = arduino
upload_protocol = arduino
monitor_speed = 115200

[env:multi]
build_flags = -D NUM_ZONES=4

[env:single]
build_flags = -D NUM_ZONES=1
